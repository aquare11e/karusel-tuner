# Portainer stack: Stacks -> Add stack -> Web editor (paste this file) or
# Repository (https://github.com/aquare11e/karusel-tuner, compose path
# compose.portainer.yaml). Set these in the stack's environment variables:
#
#   OPENVPN_CONFIG_BASE64  required: the whole .ovpn file in base64, one line
#                          (macOS: base64 -i client.ovpn; Linux: base64 -w0 client.ovpn)
#   OPENVPN_USER           VPN login, if the profile uses auth-user-pass
#   OPENVPN_PASSWORD       VPN password, if the profile uses auth-user-pass
#
# Optional: RELAY_PORT, RELAY_EXTRA_IP, PUBLIC_BASE_URL, MAX_VIEWERS,
# STARTUP_TIMEOUT, RECONNECT_WINDOW, SOURCE_URL, EPG_SOURCE_URL, EPG_REFRESH,
# EPG_DAYS.
# The relay listens on 127.0.0.1 of the Docker host: suitable for Plex on the
# same host with host networking. RELAY_EXTRA_IP publishes the same port on one
# more host address, e.g. the docker0 gateway for clients in other Docker
# networks (host.docker.internal). See README before exposing it to a LAN.
services:
  # One-shot: writes the profile into the vpn-config volume, resolving
  # `remote` host names to IPv4 on every stack (re)deploy.
  vpn-config:
    # Pinned images: update deliberately (new tag and digest here, then
    # redeploy). CI tags every main build as sha-<commit>.
    image: ghcr.io/aquare11e/karusel-tuner:sha-f5241b4@sha256:6004732dbc6fce8105f1ff9c3ccfaa705a24294311420c482c33b7717a45b447
    command: ['/usr/local/bin/vpnconf']
    environment:
      OPENVPN_CONFIG_BASE64: ${OPENVPN_CONFIG_BASE64:?set OPENVPN_CONFIG_BASE64 to the base64 of your .ovpn file}
    volumes:
      - vpn-config:/vpn-config
    restart: 'no'

  vpn:
    image: qmcgaw/gluetun:v3.41.3
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - vpn-config:/gluetun/vpn:ro
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: openvpn
      OPENVPN_CUSTOM_CONFIG: /gluetun/vpn/client.ovpn
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      FIREWALL_INPUT_PORTS: '8080'
    ports:
      - '127.0.0.1:${RELAY_PORT:-18080}:8080'
      # Unset, this repeats the line above and Compose merges the two.
      - '${RELAY_EXTRA_IP:-127.0.0.1}:${RELAY_PORT:-18080}:8080'
    depends_on:
      vpn-config:
        condition: service_completed_successfully
    restart: unless-stopped

  relay:
    image: ghcr.io/aquare11e/karusel-tuner:sha-f5241b4@sha256:6004732dbc6fce8105f1ff9c3ccfaa705a24294311420c482c33b7717a45b447
    network_mode: 'service:vpn'
    depends_on:
      vpn:
        condition: service_started
    environment:
      LISTEN_ADDR: ':8080'
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:18080}
      SOURCE_URL: ${SOURCE_URL:-https://player.mediavitrina.ru/karusel/carusel/ao___karusel____web/67ad9799d21cf/player.html}
      MAX_VIEWERS: ${MAX_VIEWERS:-2}
      STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-45s}
      RECONNECT_WINDOW: ${RECONNECT_WINDOW:-5m}
      EPG_SOURCE_URL: ${EPG_SOURCE_URL:-https://www.karusel-tv.ru/schedule/Europe/Moscow}
      EPG_REFRESH: ${EPG_REFRESH:-6h}
      EPG_DAYS: ${EPG_DAYS:-12}
    restart: unless-stopped

volumes:
  vpn-config:
